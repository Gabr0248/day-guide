const KEY="gdg.site.key", u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){
  // document.open() during the initial parse appends instead of replacing, so wait for load
  if(document.readyState!=="complete") await new Promise(r=>addEventListener("load",r,{once:true}));
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},k,u8(D.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(D.salt),iterations:D.iter},base,256));
}
// GitHub Pages lets phones cache this page for 10 min, and Home Screen apps can hold it longer:
// fetch the page fresh in the background and reload once if a newer build is out.
(()=>{
  let n=0; try{n=+sessionStorage.getItem("gdg.upd")||0;}catch(e){}
  if(n>=2) return;
  fetch(location.href.split("#")[0],{cache:"reload"}).then(r=>r.ok?r.text():"").then(t=>{
    if(t.indexOf("const D=")<0||t.indexOf(D.iv)>=0) return;
    try{sessionStorage.setItem("gdg.upd",n+1);}catch(e){}
    location.reload();
  }).catch(()=>{});
})();
(async()=>{
  let saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){try{await open_(u8(saved));return;}catch(e){try{localStorage.removeItem(KEY);}catch(_){}}}
  const f=document.getElementById("f"), msg=document.getElementById("msg");
  f.hidden=false; document.getElementById("pw").focus();
  f.onsubmit=async ev=>{
    ev.preventDefault(); msg.textContent="Unlocking…";
    try{
      const raw=await derive(document.getElementById("pw").value);
      await open_(raw);
      try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)));}catch(e){}
    }catch(e){msg.textContent="Wrong password.";}
  };
})();
